apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: smartfin

resources:
  - namespace.yaml
  - backend.yaml
  - frontend.yaml

configMapGenerator:
  - name: backend-config
    literals:
      - SMARTFIN_ENV=production
      - SMARTFIN_LOG_LEVEL=INFO
      - SMARTFIN_AI_GUIDANCE_ENABLED=false
