name: CI

# Tests the backend on SQLite and on PostgreSQL, builds the frontend, and builds both
# container images. It does not deploy anything itself: on a push to main it is run by
# deploy-aws.yml, which deploys only if these checks pass.

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (SQLite + PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: smartfin
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d smartfin"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      SMARTFIN_LOG_FILE: ""
      # test_postgres.py empties this database's public schema; it is the throwaway service above.
      TEST_DATABASE_URL: postgresql://postgres:ci-only@127.0.0.1:5432/smartfin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: backend
        run: >-
          python -m pytest -q
          unit_test/test_statement_import.py unit_test/test_credit_report.py unit_test/test_risk_scorer.py
          unit_test/test_budget_data_management.py unit_test/test_loan_schema.py unit_test/test_deployment.py
          unit_test/test_postgres.py unit_test/test_file_storage.py

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  images:
    name: Container images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build the backend image
        run: docker build --target runtime -t smartfin-backend:${{ github.sha }} backend

      - name: Build the frontend image
        run: docker build -t smartfin-frontend:${{ github.sha }} frontend

      - name: Check Terraform and the Kubernetes manifests
        run: |
          terraform -chdir=infra/terraform fmt -check
          terraform -chdir=infra/terraform init -backend=false -input=false
          terraform -chdir=infra/terraform validate
          kubectl kustomize infra/k8s/overlays/local > /dev/null
          kubectl kustomize infra/k8s/overlays/aws > /dev/null
