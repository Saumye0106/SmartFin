# Run the whole app locally in containers, the same images that get deployed.
#
#   set JWT_SECRET_KEY to a random string of 32+ characters, then:
#   docker compose up --build        ->  http://localhost:8088
#
# The database is PostgreSQL in its own container (volume smartfin-pgdata); uploaded pictures live in
# the volume smartfin-data. Both start empty and are separate from backend/auth.db on this machine.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: smartfin
      POSTGRES_USER: smartfin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartfin-local-only}
    volumes:
      - smartfin-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartfin -d smartfin"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: runtime
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY to a random string of 32+ characters}
      SMARTFIN_ENV: production
      DATABASE_URL: postgresql://smartfin:${POSTGRES_PASSWORD:-smartfin-local-only}@postgres:5432/smartfin
      # Optional integrations; the app works without them.
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_BEARER_TOKEN_BEDROCK: ${AWS_BEARER_TOKEN_BEDROCK:-}
      SMARTFIN_AI_GUIDANCE_ENABLED: ${SMARTFIN_AI_GUIDANCE_ENABLED:-false}
    volumes:
      - smartfin-data:/data
    expose:
      - "5000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_URL: http://backend:5000
    ports:
      - "8088:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  smartfin-data:
  smartfin-pgdata:
