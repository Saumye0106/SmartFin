# Run the whole app locally in containers, the same images that get deployed.
#
#   set JWT_SECRET_KEY to a random string of 32+ characters, then:
#   docker compose up --build        ->  http://localhost:8088
#
# Data (database + uploaded pictures) lives in the named volume smartfin-data and starts empty;
# it is separate from backend/auth.db on this machine.

services:
  backend:
    build:
      context: ./backend
      target: runtime
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY to a random string of 32+ characters}
      SMARTFIN_ENV: production
      # Optional integrations; the app works without them.
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_BEARER_TOKEN_BEDROCK: ${AWS_BEARER_TOKEN_BEDROCK:-}
      SMARTFIN_AI_GUIDANCE_ENABLED: ${SMARTFIN_AI_GUIDANCE_ENABLED:-false}
    volumes:
      - smartfin-data:/data
    expose:
      - "5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_URL: http://backend:5000
    ports:
      - "8088:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  smartfin-data:
